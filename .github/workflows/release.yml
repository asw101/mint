# Cut a release when a vX.Y.Z tag is pushed.
#
# This replaces a hand-run `just dist` followed by a hand-written
# `gh release create`, which is how releases went out before mint had a
# repository of its own. The failure that process kept having is the reason for
# the assertion step below: the systemd unit is not build output, so it was easy
# to publish a release that was silently missing it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Unshallow, so the version stamp below can see the tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          set -euo pipefail
          version="$(git describe --tags --match 'v*' --dirty)"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "dist/mint_${os}_${arch}" .
            echo "built ${os}/${arch}"
          done
          cd dist && sha256sum mint_* > SHA256SUMS
          cat SHA256SUMS

      - name: stage the systemd unit
        # Not build output, and the one asset a hand-cut release forgot.
        run: cp init/mint.service dist/mint.service

      - name: assert the release is complete
        run: |
          set -euo pipefail
          expected=(
            mint_darwin_amd64 mint_darwin_arm64
            mint_linux_amd64 mint_linux_arm64
            SHA256SUMS mint.service
          )
          for f in "${expected[@]}"; do
            test -s "dist/$f" || { echo "missing dist/$f" >&2; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq "${#expected[@]}"
          echo "all ${#expected[@]} assets present"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
